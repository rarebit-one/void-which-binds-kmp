name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # JVM tests (the pure domain + the software Ed25519 engine) and the Android
  # library compile. ubuntu-latest ships the Android SDK, so the StrongBox-sealed
  # `actual` is type-checked against the real android.security.keystore APIs here.
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: gradle jvmTest + android compile
        run: ./gradlew jvmTest compileReleaseKotlinAndroid --no-daemon --stacktrace

  # ktlint + detekt over the library and :androidApp. Pre-existing findings are
  # frozen in config/{ktlint,detekt}/baseline.xml (per project), so only NEW
  # violations fail. ubuntu-latest ships the Android SDK :androidApp configures with.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: gradle ktlintCheck + detekt
        run: ./gradlew ktlintCheck detekt --no-daemon --stacktrace

  # void-which-binds-go is the single source of truth for the protocol golden vectors
  # (its `testvectors` package). The copies under src/jvmTest/resources/vectors/
  # must match void-which-binds-go's testvectors/vectors/ byte-for-byte at the commit
  # pinned in VOID_WHICH_BINDS_GO_REF, so a hand-edit or a stale copy fails here rather
  # than letting the port silently agree with itself. Plain git (no extra
  # action to pin); void-which-binds-go is private. This repo is PUBLIC, so the
  # read uses a ONE-HOUR, READ-ONLY installation token for that one repository
  # (org release-bot App), never a broad PAT. Fork PRs get no secrets: the token
  # step is skipped for them and the check is skipped with a warning.
  vector-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: library-token
        # Fork and Dependabot PRs get no Actions secrets: skip, and the check warns.
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: rarebit-one
          repositories: void-which-binds-go
          permission-contents: read
      - name: diff vectors against void-which-binds-go at the pinned ref
        env:
          VOID_WHICH_BINDS_GO_TOKEN: ${{ steps.library-token.outputs.token }}
        run: |
          if [ -z "$VOID_WHICH_BINDS_GO_TOKEN" ]; then
            # Fork PRs get no secrets and cannot read the private void-which-binds-go;
            # the check still runs on every same-repo PR and on push to main.
            echo "::warning::no void-which-binds-go token (fork PR?); skipping the vector drift check"
            exit 0
          fi
          scripts/check-vector-drift.sh

  # The first-party Android authenticator app (Compose UI). Device behaviour
  # (StrongBox non-extractability, biometric gating) is device-tested per
  # docs/DEVICE-TESTING.md, not here — this job proves the app module compiles and
  # assembles, so a broken UI/build cannot merge. ubuntu-latest ships the Android SDK.
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: gradle assemble app (debug) + pure-JVM unit tests
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest --no-daemon --stacktrace

  # The Secure-Enclave `actual` is Kotlin/Native; only a macOS runner has the
  # toolchain that compiles (and simulator-tests) the iOS targets.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle wrapper/dependency/Kotlin-Native downloads between runs.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # iosSimulatorArm64Test runs commonTest (+ iosTest) as a Kotlin/Native test
      # binary on the simulator, so the pure encodings and the CryptoKit-backed
      # cryptography-kotlin provider are exercised on Apple, not just compiled.
      - name: gradle iOS compile + simulator tests
        run: >-
          ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64
          iosSimulatorArm64Test
          --no-daemon --stacktrace
