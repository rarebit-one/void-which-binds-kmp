name: publish

# Publishes the shared `void-which-binds-client` KMP artifact (all targets: metadata,
# jvm, android, iosArm64, iosSimulatorArm64) to GitHub Packages for consumption
# by relying-party apps (allthing-android, heyarr-mobile).
#
# Triggers on a published GitHub Release or a pushed `v*` tag. Before publishing it
# (1) fails if the tag does not match `version` in build.gradle.kts — a `v0.9.0`
# tag must never push a `0.8.0` artifact (or 409 against an existing one) — and
# (2) re-runs the JVM + iOS-simulator tests on the tagged commit, so a tag cut from
# an untested commit cannot publish.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A single macOS runner publishes EVERY target: the iOS Kotlin/Native klibs
  # compile only on macOS, and macos-latest also ships the Android SDK + JDK, so
  # the jvm/android/ios/metadata publications all go up in one pass. GITHUB_TOKEN
  # carries `packages: write` for the rarebit-one/void-which-binds-kmp registry.
  publish:
    runs-on: macos-latest
    # An `app-v*` Release is the Cruciform APK (release.yml), NOT a library cut —
    # republishing 'void-which-binds-client' at its unchanged version would only fail. The
    # `push: tags: v*` trigger already ignores `app-v*`; this guards the sibling
    # `release: published` trigger that the app's own Release would otherwise fire.
    if: >-
      github.event_name != 'release' ||
      !startsWith(github.event.release.tag_name, 'app-v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true # release path: no Gradle cache restore (zizmor cache-poisoning; cold build measured)
      - name: tag must equal the build.gradle.kts version
        env:
          # A Release carries its tag in the event; a tag push (or a dispatch run
          # against a tag) has it as the ref.
          TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          test -n "$version" || { echo "::error::no top-level version = \"…\" in build.gradle.kts"; exit 1; }
          if [ -z "$TAG" ]; then
            echo "::warning::not run from a tag; publishing build.gradle.kts version $version unchecked"
            exit 0
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match build.gradle.kts version $version (expected v$version)"
            exit 1
          fi
          echo "tag $TAG matches version $version"
      - name: test before publishing
        run: >-
          ./gradlew jvmTest iosSimulatorArm64Test
          --no-daemon --stacktrace
      - name: publish void-which-binds-client to GitHub Packages
        run: >-
          ./gradlew publishAllPublicationsToGitHubPackagesRepository
          --no-daemon --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
