name: release

# Cuts a signed, installable release of the Cruciform authenticator app. Triggered by
# an `app-v*` tag — the shared LIBRARY publishes on `v*` (publish.yml), so the app
# carries its own prefix and the two triggers can never collide. Builds the release
# APK signed with the release keystore (repo secrets, mirrored from
# ~/.config/rarebit-android-signing and 1Password/Sysadmins), then publishes it as
# the tag's GitHub Release asset — the artefact the phone installs. (A self-hosted
# install page + in-app updater is designed in heyarr-core#441; not built yet.)
#
# The debug CI (test.yml) is unchanged and remains the merge gate.

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

# Only `contents: write` — the app builds against the in-repo library (project(":")),
# so nothing is resolved from GitHub Packages.
permissions:
  contents: write

concurrency:
  group: release-app-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#app-v}" >> "$GITHUB_OUTPUT"

      # Endpoint defaults baked into BuildConfig (androidApp/build.gradle.kts). None are
      # committed, so a release gets them from repository VARIABLES (not secrets: they
      # are URLs the APK ships in plain sight). Fail here, before the build, rather than
      # publish an APK with no relay to pair through or no RP to push membership to.
      # CRUCIFORM_DEFAULT_NOTIFY is optional: without it the app skips push registration.
      # Every value must be https:// (release builds block cleartext; the gradle
      # preReleaseBuild check would reject it later anyway).
      - name: Require the release endpoint variables
        env:
          CRUCIFORM_DEFAULT_RELAY: ${{ vars.CRUCIFORM_DEFAULT_RELAY }}
          CRUCIFORM_DEFAULT_NOTIFY: ${{ vars.CRUCIFORM_DEFAULT_NOTIFY }}
          CRUCIFORM_MEMBERSHIP_RPS: ${{ vars.CRUCIFORM_MEMBERSHIP_RPS }}
        run: |
          fail=0
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
          check_https() { # name value
            local url
            IFS=',' read -ra urls <<< "$2"
            for url in "${urls[@]}"; do
              url="$(trim "$url")"
              [ -z "$url" ] && continue
              if [[ "$url" != https://* ]]; then
                echo "::error title=Insecure release variable::Repository variable $1 must contain only https:// URLs (release builds block cleartext)."
                fail=1
              fi
            done
          }
          for name in CRUCIFORM_DEFAULT_RELAY CRUCIFORM_MEMBERSHIP_RPS; do
            value="$(trim "${!name}")"
            if [ -z "$value" ] || [ -z "$(trim "${value//,/}")" ]; then
              echo "::error title=Missing release variable::Repository variable $name is not set. Set it with: gh variable set $name -R ${{ github.repository }} --body 'https://...'"
              fail=1
            else
              check_https "$name" "$value"
            fi
          done
          notify="$(trim "$CRUCIFORM_DEFAULT_NOTIFY")"
          if [ -z "$notify" ]; then
            echo "::warning title=No push plane::CRUCIFORM_DEFAULT_NOTIFY is not set; this release build will skip push registration."
          else
            check_https CRUCIFORM_DEFAULT_NOTIFY "$notify"
          fi
          exit "$fail"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # android-actions/setup-android re-downloads cmdline-tools and tries to install the
      # removed `tools` package, failing sdkmanager ("Failed to find package 'tools'"). The
      # ubuntu runner already ships an Android SDK at $ANDROID_HOME, so just accept its
      # licenses (mirrors heyarr-kmp's android-release.yml). ANDROID_HOME stays set for the
      # apksigner step; gradle auto-downloads any missing platform under the accepted licenses.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-disabled: true # release path: no Gradle cache restore (zizmor cache-poisoning; cold build measured)

      - name: Assemble the signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CRUCIFORM_DEFAULT_RELAY: ${{ vars.CRUCIFORM_DEFAULT_RELAY }}
          CRUCIFORM_DEFAULT_NOTIFY: ${{ vars.CRUCIFORM_DEFAULT_NOTIFY }}
          CRUCIFORM_MEMBERSHIP_RPS: ${{ vars.CRUCIFORM_MEMBERSHIP_RPS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew :androidApp:assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.tag }}
          -PdeviceEngine=true
          --no-daemon --stacktrace

      - name: Name the APK after the release
        id: apk
        run: |
          src=androidApp/build/outputs/apk/release/androidApp-release.apk
          test -f "$src" || { echo "no APK at $src"; ls -R androidApp/build/outputs/apk || true; exit 1; }
          out="cruciform-${{ steps.version.outputs.version }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Prove it carries the release certificate
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$signer" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          {
            printf '**Cruciform %s**\n\n' "$VERSION"
            printf 'Signed release APK. Download and `adb install` it, or open this page\n'
            printf 'on the phone.\n\n'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Tag: `%s`\n' "$TAG"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Signed with the Cruciform release key (`apksigner verify` ran in CI).\n'
            printf -- '- Built with `-PdeviceEngine=true` (release forces the hardware-backed engine).\n'
          } > notes.md
          # A semver prerelease tag (app-v1.0.0-rc.1) publishes as a GitHub PRERELEASE.
          # The homelab-ops F-Droid puller skips prereleases, so a gen2 build can be
          # staged before the ADR-0022 cutover without gen1 phones auto-updating to it
          # (C1). At C2, tag the plain version (app-v1.0.0) to put it on F-Droid.
          pre=false
          case "$VERSION" in *-*) pre=true ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Cruciform $VERSION" --notes-file notes.md --prerelease="$pre"
          else
            gh release create "$TAG" "$APK" --title "Cruciform $VERSION" --notes-file notes.md --prerelease="$pre"
          fi
