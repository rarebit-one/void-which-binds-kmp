name: Cruciform
options:
  bundleIdPrefix: one.rarebit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # No code signing needed for a Simulator build; a real device build sets a team.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  # The authenticator app is named Cruciform (ADR-0004); the KMP framework it links
  # is `VoidWhichBinds` (the protocol). Sources still live under the `Voidbind/` folder.
  Cruciform:
    type: application
    platform: iOS
    sources:
      - path: Voidbind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.rarebit.cruciform
        # The KMP framework's module is 'VoidWhichBinds'; the app's own Swift module name is
        # distinct so `import VoidWhichBinds` resolves to the framework, not itself.
        PRODUCT_MODULE_NAME: CruciformApp
        INFOPLIST_FILE: Voidbind/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      # Built by `./gradlew assembleVoidWhichBindsDebugXCFramework` (see preBuildScripts).
      - framework: ../build/XCFrameworks/debug/VoidWhichBinds.xcframework
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Assemble VoidWhichBinds.xcframework (KMP)
        basedOnDependencyAnalysis: false
        # Always invoke Gradle: its up-to-date checks make an unchanged rebuild cheap,
        # and skipping it when the XCFramework merely EXISTS silently links a stale
        # framework after a Kotlin change.
        script: |
          set -e
          cd "$PROJECT_DIR/.."
          ./gradlew assembleVoidWhichBindsDebugXCFramework
